name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

      - name: mypy
        run: mypy src scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The Perch weights are ~400 MB and are not committed, so tests marked
      # `model` are skipped here. Everything else runs against a mocked session.
      - name: Run tests
        run: pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wildecho-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts with an empty models/ volume, so the service must come up in a
      # degraded-but-honest state rather than crash-looping.
      - name: Smoke test container without model weights
        run: |
          docker run -d --name wildecho -p 8000:8000 wildecho-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- /v1/health ---"
          curl -fsS http://localhost:8000/v1/health
          echo
          echo "--- /v1/about ---"
          curl -fsS http://localhost:8000/v1/about
          echo
          docker logs wildecho
          docker rm -f wildecho
