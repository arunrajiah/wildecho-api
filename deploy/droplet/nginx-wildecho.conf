# nginx site for wildecho.arunrajiah.com: static landing page (from the wildecho
# repo's site/, deployed to /var/www/wildecho) with every other path proxied to
# wildecho-api. TLS lines were added by `certbot --nginx -d wildecho.arunrajiah.com`.
server {
  server_name wildecho.arunrajiah.com;
  root /var/www/wildecho;

  client_max_body_size 25m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / { try_files /index.html =404; }
  location = /privacy { try_files /privacy.html =404; }
  location /assets/ { expires 7d; try_files $uri =404; }

  location / { try_files $uri @api; }

  location @api {
    proxy_pass http://127.0.0.1:7860;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wildecho.arunrajiah.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wildecho.arunrajiah.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = wildecho.arunrajiah.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

  listen 80;
  server_name wildecho.arunrajiah.com;
    return 404; # managed by Certbot
}
